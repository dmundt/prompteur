name: Compatibility Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: ['1.96.0', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:host
        if: runner.os == 'Linux'
      - run: npm run test:host
        if: runner.os != 'Linux'
