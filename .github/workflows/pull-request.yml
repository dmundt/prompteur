name: Pull Request CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-validation:
    name: PR validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run test:host
