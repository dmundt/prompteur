name: Publish Extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag and source branch
        id: release
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          node scripts/release.mjs >> "$GITHUB_OUTPUT"
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main
      - run: npm ci
      - run: npm run test:release
      - run: npm run build
      - name: Package VSIX
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          VSIX="prompteur-${VERSION}.vsix"
          if [ "$PRERELEASE" = "true" ]; then
            npm run package -- --pre-release --out "$VSIX"
          else
            npm run package -- --out "$VSIX"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: extension-vsix-${{ steps.release.outputs.version }}
          path: prompteur-${{ steps.release.outputs.version }}.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-vsix-${{ needs.package.outputs.version }}
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          VSIX="prompteur-${VERSION}.vsix"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[].name" | grep -Fxq "$VSIX"; then
              gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
            fi
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --generate-notes --verify-tag --prerelease --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish to VS Code Marketplace
        env:
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          VSIX="prompteur-${VERSION}.vsix"
          if [ "$PRERELEASE" = "true" ]; then
            npx vsce publish --oidc --pre-release --packagePath "$VSIX"
          else
            npx vsce publish --oidc --packagePath "$VSIX"
          fi
