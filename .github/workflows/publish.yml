name: Publish Extension

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag and source branch
        id: release
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          node scripts/release.mjs >> "$GITHUB_OUTPUT"
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main
      - run: npm ci
      - run: npm run test:release
      - run: npm run build
      - name: Package VSIX
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          VSIX="prompteur-${VERSION}.vsix"
          if [ "$PRERELEASE" = "true" ]; then
            npm run package -- --pre-release --out "$VSIX"
          else
            npm run package -- --out "$VSIX"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: extension-vsix-${{ steps.release.outputs.version }}
          path: prompteur-${{ steps.release.outputs.version }}.vsix
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: extension-vsix-${{ needs.package.outputs.version }}
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          VSIX="prompteur-${VERSION}.vsix"
          RELEASE_DIR="$(mktemp -d)"
          trap 'rm -rf "$RELEASE_DIR"' EXIT
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets > "$RELEASE_DIR/release.json" 2>/dev/null; then
            if jq -e --arg name "$VSIX" '.assets | any(.name == $name)' "$RELEASE_DIR/release.json" >/dev/null; then
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$VSIX" --dir "$RELEASE_DIR"
              node scripts/release.mjs --verify-existing "$RELEASE_DIR/release.json" "$VSIX" "$RELEASE_DIR/$VSIX"
            else
              node scripts/release.mjs --verify-existing "$RELEASE_DIR/release.json" "$VSIX"
              gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
            fi
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --generate-notes --verify-tag --prerelease --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
            gh release upload "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish to VS Code Marketplace
        env:
          VERSION: ${{ needs.package.outputs.version }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          VSIX="prompteur-${VERSION}.vsix"
          if [ "$PRERELEASE" = "true" ]; then
            npx vsce publish --oidc --pre-release --packagePath "$VSIX"
          else
            npx vsce publish --oidc --packagePath "$VSIX"
          fi
