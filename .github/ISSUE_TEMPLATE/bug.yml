name: Bug report
description: Report a reproducible defect.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence.
      placeholder: '1. ...'
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Version and environment
      description: Extension version, VS Code version, and operating system.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove secrets and private prompt/workspace content before sharing.
    validations:
      required: false
